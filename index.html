<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    }
    main {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 18px;
    }
    form { width: min(560px, 100%); }
    input {
      width: 100%;
      background: #fff;
      color: #111;
      border: 0;
      border-radius: 999px;
      padding: 16px 22px;
      font-size: 18px;
      outline: none;
    }
    input::placeholder { color: #8a8a8a; }
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      max-width: 560px;
    }
    button.chip {
      background: transparent;
      color: #fff;
      border: 1px solid #333;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 14px;
      cursor: pointer;
    }
    button.chip:hover { border-color: #fff; }
  </style>
</head>
<body>
  <main>
    <form id="search" action="https://www.google.com/search" method="get">
      <input id="q" name="q" type="search" autocomplete="off" aria-label="Search" placeholder="Facebook">
    </form>
    <div class="suggestions" id="suggestions"></div>
  </main>
  <script>
    const terms = ["Facebook", "fb", "ig", "Instagram", "game", "cv"];
    const input = document.getElementById("q");
    const suggestions = document.getElementById("suggestions");

    function shuffle(list) {
      const copy = list.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function render() {
      const order = shuffle(terms);
      input.placeholder = order[0];
      suggestions.innerHTML = "";
      order.slice(1).forEach((term) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "chip";
        button.textContent = term;
        button.addEventListener("click", () => {
          input.value = term;
          input.focus();
        });
        suggestions.appendChild(button);
      });
    }

    render();
  </script>
</body>
</html>
