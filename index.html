<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
    }
    body {
      background: #fff;
      color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      animation: background-pan 10s linear infinite;
      background-size: 200%;
      height: 100vh;
      overflow: hidden;
    }
    body.toggled {
      animation: none;
    }

    @keyframes background-pan {
      from { background-position: 0% center; }
      to { background-position: -200% center; }
    }

    #tiles {
      height: calc(100vh - 1px);
      width: calc(100vw - 1px);
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(var(--columns), 1fr);
      grid-template-rows: repeat(var(--rows), 1fr);
    }
    .tile {
      cursor: pointer;
      position: relative;
    }
    .tile:before {
      background-color: #000;
      content: "";
      inset: 0;
      position: absolute;
    }

    .cat {
      position: absolute;
      background: #d9d9d9;
      width: 150px;
      height: 120px;
      border-radius: 150px 150px 50% 50%;
      left: 50%;
      top: 50%;
      margin: -60px 0 0 -75px;
      z-index: 3;
      pointer-events: none;
    }
    .stripe .stripe1 {
      position: relative;
      background: #3a3a3a;
      border-radius: 30px 30px 150px 150px;
      top: -49.8px;
      width: 10px;
      height: 32px;
      left: 47%;
      z-index: 4;
    }
    .stripe .stripe2 {
      position: relative;
      background: #3a3a3a;
      border-radius: 190px 0 150px 150px;
      top: -82px;
      width: 10px;
      height: 20px;
      left: 37%;
      z-index: 4;
    }
    .stripe .stripe3 {
      position: relative;
      background: #3a3a3a;
      border-radius: 0 190px 150px 150px;
      top: -101px;
      width: 10px;
      height: 20px;
      left: 57%;
      z-index: 4;
    }
    .cat .ear {
      background: #d9d9d9;
      position: relative;
      z-index: -1;
    }
    .cat .ear.left {
      width: 50px;
      height: 50px;
      border-radius: 8px 20px 20px 20px;
      left: 5px;
      top: 5px;
    }
    .cat .ear.left:before {
      content: "";
      display: block;
      width: 25px;
      height: 25px;
      background: #bdbdbd;
      border-radius: 10px 40px 30px 40px;
      position: absolute;
      left: 4px;
      top: 4px;
      border: 2px solid #8a8a8a;
      border-right: 0;
      border-bottom: 0;
    }
    .cat .ear.right {
      width: 50px;
      height: 50px;
      border-radius: 20px 8px 20px 20px;
      position: absolute;
      right: 5px;
      top: 5px;
    }
    .cat .ear.right:before {
      content: "";
      display: block;
      width: 25px;
      height: 25px;
      background: #bdbdbd;
      border-radius: 40px 8px 40px 30px;
      position: absolute;
      right: 4px;
      top: 4px;
      border: 2px solid #8a8a8a;
      border-left: 0;
      border-bottom: 0;
    }
    .cat .eye {
      position: absolute;
      border: 3px solid #111;
      background: #f4f4f4;
      width: 24px;
      height: 14px;
      top: 45px;
      border-radius: 50%;
    }
    .cat .eye.left { left: 50px; margin: 0 0 0 -15px; }
    .cat .eye.right { right: 50px; margin: 0 -15px 0 0; }
    .cat .nose {
      width: 16px;
      height: 10px;
      background: #111;
      border-radius: 50%;
      position: absolute;
      top: 65px;
      left: 50%;
      margin: 0 0 0 -8px;
    }
    .cat .nose:before,
    .cat .nose:after {
      content: "";
      display: block;
      background: #cfcfcf;
      width: 18px;
      height: 12px;
      border-radius: 50%;
      position: absolute;
      top: 6px;
    }
    .cat .nose:before { left: -10px; }
    .cat .nose:after { left: 8px; }
    .cat .mouth {
      border: 3px solid #111;
      width: 12px;
      height: 12px;
      border-right: 0;
      border-bottom: 0;
      position: absolute;
      left: 68px;
      top: 79px;
      transform: rotate(45deg);
    }
    .cat .mouth:before {
      content: "";
      display: block;
      width: 5px;
      border-top: 3px solid #111;
      position: absolute;
      left: -6px;
      top: -5px;
      transform: rotate(45deg);
    }
    .cat .mouth:after {
      content: "";
      display: block;
      width: 10px;
      height: 10px;
      border: 3px solid #111;
      border-radius: 0 0 30px 50%;
      border-left: 0;
      border-top: 0;
      border-bottom-width: 2px;
      position: absolute;
      left: -13px;
      top: 8px;
    }
    .cat .mouth1:after {
      content: "";
      display: block;
      width: 10px;
      height: 10px;
      border: 3px solid #111;
      border-radius: 0 0 30px 50%;
      border-left: 0;
      border-top: 0;
      border-bottom-width: 2px;
      position: absolute;
      transform: rotateY(180deg) rotate(45deg);
      left: 83px;
      top: 79px;
    }
    .iris-before {
      width: 7px;
      height: 14px;
      background: #111;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      transition: transform 0.3s ease, width 0.3s ease;
    }

    main {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 4;
      pointer-events: none;
    }
    form {
      width: auto;
      pointer-events: auto;
      transform: translateY(-108px);
    }
    .field {
      display: inline-grid;
      background: #fff;
      max-width: calc(100vw - 48px);
      transition: background 0.35s ease;
    }
    body.toggled .field { background: #000; }
    .sizer, .ghost, input {
      grid-area: 1 / 1;
      font-family: inherit;
      font-size: 18px;
      line-height: 1.2;
      padding: 4px 8px;
      border: 0;
      border-radius: 0;
      white-space: pre;
    }
    .sizer {
      visibility: hidden;
      min-width: 1ch;
    }
    .ghost {
      color: #9a9a9a;
      pointer-events: none;
      overflow: hidden;
      transition: color 0.35s ease;
    }
    body.toggled .ghost { color: #6e6e6e; }
    input {
      width: 100%;
      min-width: 0;
      background: transparent;
      color: #111;
      outline: none;
      caret-color: #111;
      transition: color 0.35s ease, caret-color 0.35s ease;
    }
    body.toggled input {
      color: #fff;
      caret-color: #fff;
    }
    input::-webkit-search-cancel-button { display: none; }
  </style>
</head>
<body>
  <div id="tiles"></div>
  <div class="cat">
    <div class="head">
      <div class="ear left"></div>
      <div class="ear right"></div>
      <div class="eye left"><div class="iris-before"></div></div>
      <div class="eye right"><div class="iris-before"></div></div>
      <div class="nose"></div>
      <div class="mouth"></div>
      <div class="mouth1"></div>
      <div class="stripe">
        <div class="stripe1"></div>
        <div class="stripe2"></div>
        <div class="stripe3"></div>
      </div>
    </div>
  </div>
  <main>
    <form id="search" action="https://www.google.com/search" method="get">
      <div class="field">
        <span class="sizer" id="sizer"></span>
        <div class="ghost" id="ghost" aria-hidden="true"></div>
        <input id="q" name="q" type="search" size="1" autocomplete="off" aria-label="Search">
      </div>
    </form>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <script>
    const wrapper = document.getElementById("tiles");
    let columns = 0, rows = 0, toggled = false;

    const toggle = () => {
      toggled = !toggled;
      document.body.classList.toggle("toggled");
    };

    const handleOnClick = index => {
      toggle();
      anime({
        targets: ".tile",
        opacity: toggled ? 0 : 1,
        delay: anime.stagger(50, {
          grid: [columns, rows],
          from: index
        })
      });
    };

    const createTile = index => {
      const tile = document.createElement("div");
      tile.classList.add("tile");
      tile.style.opacity = toggled ? 0 : 1;
      tile.onclick = () => handleOnClick(index);
      return tile;
    };

    const createTiles = quantity => {
      Array.from(Array(quantity)).forEach((_, index) => {
        wrapper.appendChild(createTile(index));
      });
    };

    const createGrid = () => {
      wrapper.innerHTML = "";
      const size = document.body.clientWidth > 800 ? 25 : 5;
      columns = Math.floor(document.body.clientWidth / size);
      rows = Math.floor(document.body.clientHeight / size);
      wrapper.style.setProperty("--columns", columns);
      wrapper.style.setProperty("--rows", rows);
      createTiles(columns * rows);
    };

    createGrid();
    window.onresize = () => createGrid();

    const irises = document.querySelectorAll(".eye");
    const eyeWidth = 7;
    const cat = document.querySelector(".cat");

    function resetIrises() {
      irises.forEach((iris) => {
        const irisBefore = iris.querySelector(".iris-before");
        irisBefore.style.transform = "translate(-50%, -50%)";
        irisBefore.style.width = eyeWidth + "px";
      });
    }

    function moveIrises(event) {
      const rect = cat.getBoundingClientRect();
      const catCenterX = rect.left + rect.width / 2;
      const catCenterLowerY = rect.top + rect.height;
      const catCenterUpperY = rect.top;
      const distanceToCenterX = event.clientX - catCenterX;

      if (Math.abs(distanceToCenterX) <= 800 && catCenterLowerY >= event.clientY && catCenterUpperY <= event.clientY) {
        irises.forEach((iris) => {
          const irisBefore = iris.querySelector(".iris-before");
          irisBefore.style.width = "14px";
          const newX = distanceToCenterX > 0
            ? Math.min(0.1, distanceToCenterX)
            : Math.max(-12, distanceToCenterX);
          irisBefore.style.transform = "translateX(" + newX + "px) translateY(-50%)";
        });
      } else {
        resetIrises();
      }
    }

    document.addEventListener("mousemove", moveIrises);

    const terms = ["Facebook", "fb", "ig", "Instagram", "game", "cv"];
    const input = document.getElementById("q");
    const ghost = document.getElementById("ghost");
    const sizer = document.getElementById("sizer");
    const suggestion = terms[Math.floor(Math.random() * terms.length)];

    function paint() {
      const value = input.value;
      const matches = suggestion.toLowerCase().startsWith(value.toLowerCase());
      ghost.textContent = matches ? suggestion : "";
      sizer.textContent = ghost.textContent || value || " ";
    }

    input.addEventListener("input", paint);
    paint();

    function editDistance(a, b) {
      const row = Array.from({ length: a.length + 1 }, (_, i) => [i]);
      for (let j = 0; j <= b.length; j++) row[0][j] = j;
      for (let i = 1; i <= a.length; i++) {
        for (let j = 1; j <= b.length; j++) {
          row[i][j] = a[i - 1] === b[j - 1]
            ? row[i - 1][j - 1]
            : 1 + Math.min(row[i - 1][j], row[i][j - 1], row[i - 1][j - 1]);
        }
      }
      return row[a.length][b.length];
    }

    function destination(query) {
      const word = query.trim().toLowerCase();
      if (!word) return "";
      if (word === "fb" || word === "facebook") return "https://www.facebook.com/cloud.sep0/";
      const likeInstagram = word === "ig"
        || word === "insta"
        || word.startsWith("instag")
        || editDistance(word, "instagram") <= 2;
      if (likeInstagram) return "https://www.instagram.com/13m.juju/";
      return "https://www.google.com/search?q=" + encodeURIComponent(query.trim());
    }

    document.getElementById("search").addEventListener("submit", (event) => {
      event.preventDefault();
      const query = input.value.trim() || (ghost.textContent ? suggestion : "");
      const url = destination(query);
      if (url) location.href = url;
    });
  </script>
</body>
</html>
