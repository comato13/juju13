<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>About me</title>
  <link rel="stylesheet" href="style.css?v=19">
</head>
<body>
  <div id="tiles"></div>
  <div class="cat">
    <div class="head">
      <div class="ear left"></div>
      <div class="ear right"></div>
      <div class="eye left"><div class="iris-before"></div></div>
      <div class="eye right"><div class="iris-before"></div></div>
      <div class="nose"></div>
      <div class="whiskers left"><span></span><span></span><span></span></div>
      <div class="whiskers right"><span></span><span></span><span></span></div>
      <div class="mouth"></div>
      <div class="mouth1"></div>
      <div class="stripe">
        <div class="stripe1"></div>
        <div class="stripe2"></div>
        <div class="stripe3"></div>
      </div>
    </div>
  </div>
  <div class="orbit" id="orbit" aria-label="Recommendations"></div>
  <main>
    <form id="search" action="https://www.google.com/search" method="get">
      <div class="field">
        <span class="sizer" id="sizer"></span>
        <div class="ghost" id="ghost" aria-hidden="true"></div>
        <input id="q" name="q" type="search" size="1" autocomplete="off" aria-label="Search">
        <svg class="tail" viewBox="0 0 112 90" aria-hidden="true">
          <path d="M0 0H86V28L86 32 87 36 88 40 89 44 91 48 93 52 96 56 98 60 102 64 106 68 108 72 109 76 108 80 106 84 102 88 89 88 75 84 65 80 57 76 50 72 43 68 37 64 32 60 27 56 22 52 18 48 14 44 10 40 6 36 3 32 0 28Z"/>
        </svg>
      </div>
    </form>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <script src="script.js?v=10"></script>
</body>
</html>
