<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    }
    main {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    form { width: auto; }
    .field {
      display: inline-grid;
      background: #fff;
      max-width: calc(100vw - 48px);
    }
    .sizer, .ghost, input {
      grid-area: 1 / 1;
      font-family: inherit;
      font-size: 18px;
      line-height: 1.2;
      padding: 4px 8px;
      border: 0;
      border-radius: 0;
      white-space: pre;
    }
    .sizer {
      visibility: hidden;
      min-width: 1ch;
    }
    .ghost {
      color: #9a9a9a;
      pointer-events: none;
      overflow: hidden;
    }
    input {
      width: 100%;
      min-width: 0;
      background: transparent;
      color: #111;
      outline: none;
    }
    input::-webkit-search-cancel-button { display: none; }
  </style>
</head>
<body>
  <main>
    <form id="search" action="https://www.google.com/search" method="get">
      <div class="field">
        <span class="sizer" id="sizer"></span>
        <div class="ghost" id="ghost" aria-hidden="true"></div>
        <input id="q" name="q" type="search" size="1" autocomplete="off" aria-label="Search">
      </div>
    </form>
  </main>
  <script>
    const terms = ["Facebook", "fb", "ig", "Instagram", "game", "cv"];
    const input = document.getElementById("q");
    const ghost = document.getElementById("ghost");
    const sizer = document.getElementById("sizer");
    const suggestion = terms[Math.floor(Math.random() * terms.length)];

    function paint() {
      const value = input.value;
      const matches = suggestion.toLowerCase().startsWith(value.toLowerCase());
      ghost.textContent = matches ? suggestion : "";
      sizer.textContent = ghost.textContent || value || " ";
    }

    input.addEventListener("input", paint);
    paint();

    function editDistance(a, b) {
      const rows = Array.from({ length: a.length + 1 }, (_, i) => [i]);
      for (let j = 0; j <= b.length; j++) rows[0][j] = j;
      for (let i = 1; i <= a.length; i++) {
        for (let j = 1; j <= b.length; j++) {
          rows[i][j] = a[i - 1] === b[j - 1]
            ? rows[i - 1][j - 1]
            : 1 + Math.min(rows[i - 1][j], rows[i][j - 1], rows[i - 1][j - 1]);
        }
      }
      return rows[a.length][b.length];
    }

    function destination(query) {
      const word = query.trim().toLowerCase();
      if (!word) return "";
      if (word === "fb" || word === "facebook") return "https://www.facebook.com/cloud.sep0/";
      const likeInstagram = word === "ig"
        || word === "insta"
        || word.startsWith("instag")
        || editDistance(word, "instagram") <= 2;
      if (likeInstagram) return "https://www.instagram.com/13m.juju/";
      return "https://www.google.com/search?q=" + encodeURIComponent(query.trim());
    }

    document.getElementById("search").addEventListener("submit", (event) => {
      event.preventDefault();
      const query = input.value.trim() || (ghost.textContent ? suggestion : "");
      const url = destination(query);
      if (url) location.href = url;
    });
  </script>
</body>
</html>
